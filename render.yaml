services:
  - type: web
    name: tshepo-sandisile-wedding
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
        description: Random secret used to sign admin JWTs. Auto-generated.
      - key: MONGO_URI
        sync: false
        description: MongoDB Atlas connection string (mongodb+srv://...).
      - key: ADMIN_USER
        sync: false
        description: Admin username (set in the Render dashboard before first boot).
      - key: ADMIN_PASSWORD
        sync: false
        description: Admin password used to seed the bcrypt hash on first deploy (set in dashboard).
      - key: SMTP_HOST
        sync: false
        description: SMTP provider host, for example smtp.gmail.com.
      - key: SMTP_PORT
        sync: false
        description: SMTP provider port, usually 587.
      - key: SMTP_SECURE
        value: "false"
        description: Set true only when using an SSL SMTP port such as 465.
      - key: SMTP_USER
        sync: false
        description: SMTP account username.
      - key: SMTP_PASSWORD
        sync: false
        description: SMTP password or provider app password.
      - key: MAIL_FROM
        sync: false
        description: Sender address approved by your SMTP provider.
